[project]
name = "boss-harness"
version = "0.2.0rc20"
description = "BOSS Harness 的 Agent Harness 内核：以 stdio JSON-RPC 服务端形式运行"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["anthropic>=1.15", "openai>=3.35"]

[project.scripts]
boss-harness = "boss_harness.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_harness"]

[tool.hatch.build.targets.sdist]
exclude = ["uv.lock"]
