[project]
name = "boss-harness"
version = "0.2.0rc524"
description = "BOSS Harness 的 Agent Harness 内核：以 stdio JSON-RPC 服务端形式运行"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "agent-harness", "recruiting", "json-rpc", "desktop", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["anthropic>=1.15", "openai>=3.35"]

[project.urls]
Homepage = "https://github.com/can4hou6joeng4/boss-harness"
Repository = "https://github.com/can4hou6joeng4/boss-harness"
Issues = "https://github.com/can4hou6joeng4/boss-harness/issues"
Changelog = "https://github.com/can4hou6joeng4/boss-harness/blob/main/CHANGELOG.md"

[project.scripts]
boss-harness = "boss_harness.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_harness"]

[tool.hatch.build.targets.sdist]
exclude = ["uv.lock"]
