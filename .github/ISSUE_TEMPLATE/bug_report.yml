name: 缺陷报告
description: 报告可复现的缺陷；请先移除凭据、真实会话与个人资料
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。标题建议写成 `fix(scope): 中文描述`，并把复现条件与验证范围写清楚。
        公开 Issue 中不要粘贴模型凭据、Cookie、真实招聘记录、个人资料或本机私有路径；安全漏洞请按安全政策私下报告。
  - type: input
    id: version
    attributes:
      label: 版本与安装方式
      description: 写明候选版本或提交、安装来源（源码构建 / wheel / sdist / 桌面源码）以及是否使用上游 CLI。
      placeholder: 例如 0.2.0-rc.55 源码构建，BOSS_HARNESS_PROVIDER=none
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS
        - Linux
        - Windows
        - 其他
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 桌面界面
        - 会话与持久化
        - 队列与后续回合
        - 审批与停止
        - 模型线路
        - 上游 CLI 与浏览器来源
        - 文档与发布产物
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始的最小步骤；说明使用的模型线路、上游命令与开关。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明是否可稳定复现、是否只在特定会话或队列状态下出现。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 只保留定位问题所需片段；删除 Cookie、令牌、账号、职位与候选人信息。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: verification
    attributes:
      label: 已完成的验证
      description: 说明问题在哪种环境下确认；未验证的场景请如实选择。
      options:
        - 离线源码构建
        - 隔离安装的 wheel / sdist
        - 真实模型回合
        - 真实招聘平台
        - 仅静态阅读代码
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 已移除凭据、Cookie、真实会话、个人资料与本机私有路径。
          required: true
        - label: 已核对 README 与使用指南中已声明的限制，并确认不是重复 Issue。
          required: true
