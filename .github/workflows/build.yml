name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source versions
        id: versions
        run: |
          SOURCE_VERSION="$(python scripts/check_versions.py)"
          printf 'Source package versions agree on %s\n' "$SOURCE_VERSION"
          printf 'python=%s\n' "$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify protocol constants
        run: python scripts/check_protocol.py
      - name: Verify JSON-RPC boundaries
        run: python scripts/check_rpc.py
      - name: Verify desktop security settings
        run: python scripts/check_desktop_security.py
      - name: Verify workflow security settings
        run: python scripts/check_workflows.py
      - name: Verify harness tool allowlist
        run: python scripts/check_harness_tools.py
      - name: Verify session export privacy
        run: python scripts/check_export_privacy.py
      - name: Verify private state boundaries
        run: python scripts/check_private_files.py
      - name: Verify credential redaction
        run: python scripts/check_secret.py
      - name: Verify lifecycle hook boundaries
        run: python scripts/check_hooks.py
      - name: Verify persistence index boundaries
        run: python scripts/check_persistence.py
      - name: Verify settings persistence boundaries
        run: python scripts/check_settings.py
      - name: Verify shutdown wait boundaries
        run: python scripts/check_shutdown.py
      - name: Verify tool bridge cleanup
        run: python scripts/check_bridge_lifecycle.py
      - name: Verify index repair boundaries
        run: python scripts/check_maintenance.py
      - name: Verify snapshot store boundaries
        run: python scripts/check_snapshot_store.py
      - name: Verify state directory ownership
        run: python scripts/check_ownership.py
      - name: Verify workspace skill boundaries
        run: python scripts/check_skills.py
      - name: Verify workspace instruction boundaries
        run: python scripts/check_workspace_instructions.py
      - name: Verify attachment boundaries
        run: python scripts/check_attachments.py
      - name: Verify tool result boundaries
        run: python scripts/check_tool_results.py
      - name: Verify tool envelope boundaries
        run: python scripts/check_toolkit.py
      - name: Verify item content boundaries
        run: python scripts/check_item_content.py
      - name: Verify tool argument boundaries
        run: python scripts/check_tool_schema.py
      - name: Verify queue steering boundaries
        run: python scripts/check_queue_steer.py
      - name: Verify queue view boundaries
        run: python scripts/check_queue_view.py
      - name: Verify loop guard boundaries
        run: python scripts/check_loop_guard.py
      - name: Verify browser source boundaries
        run: python scripts/check_browser_source.py
      - name: Verify connection lifecycle boundaries
        run: python scripts/check_connection_lifecycle.py
      - name: Verify connection report boundaries
        run: python scripts/check_connection_report.py
      - name: Verify approval decision boundaries
        run: python scripts/check_approval.py
      - name: Verify model disable boundaries
        run: python scripts/check_model_disable.py
      - name: Verify request policy boundaries
        run: python scripts/check_request_policy.py
      - name: Verify usage boundaries
        run: python scripts/check_usage.py
      - name: Verify startup diagnostics boundaries
        run: python scripts/check_startup_diagnostics.py
      - name: Verify summary planning boundaries
        run: python scripts/check_summary.py
      - name: Verify compaction policy boundaries
        run: python scripts/check_compaction.py
      - name: Verify turn request limits
        run: python scripts/check_turn_limits.py
      - name: Verify model output budgets
        run: python scripts/check_output_budget.py
      - name: Verify model stream buffering
        run: python scripts/check_stream_pump.py
      - name: Verify model error classification
        run: python scripts/check_errors.py
      - name: Verify Anthropic continuation metadata
        run: python scripts/check_continuation.py
      - name: Verify context retention hint boundaries
        run: python scripts/check_context_keep.py
      - name: Verify catch-up steering boundary
        run: python scripts/check_catchup_boundary.py
      - name: Verify request identity boundaries
        run: python scripts/check_request_identity.py
      - name: Verify task ownership boundaries
        run: python scripts/check_task_ownership.py
      - name: Verify search snippet boundaries
        run: python scripts/check_search_snippet.py
      - name: Verify release asset boundaries
        run: python scripts/check_release_assets.py
      - name: Verify search normalization
        run: python scripts/check_search_unicode.py
      - name: Verify documentation links
        run: python scripts/check_docs_links.py
      - run: npm ci
      # 生产产物不打包开发依赖；生产树按 moderate 阻断，开发树仍按 critical 阻断，
      # 避免上游尚无修复版的高危构建工具公告长期冻结所有源码 PR。
      - run: npm audit --audit-level=moderate --omit=dev
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install build packaging
      - run: python -m build ./harness --outdir dist/python
      - name: Generate release asset manifest
        env:
          SOURCE_VERSION: ${{ steps.versions.outputs.python }}
        run: |
          python scripts/release_assets.py \
            --version "$SOURCE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --out-dir dist/python \
            dist/python/*.whl dist/python/*.tar.gz
      - name: Verify release asset manifest
        working-directory: dist/python
        run: sha256sum -c SHA256SUMS.txt
      - name: Verify distributions install and start
        shell: bash
        env:
          SOURCE_VERSION: ${{ steps.versions.outputs.python }}
        run: |
          STATE_DIR="$(mktemp -d "$RUNNER_TEMP/boss-harness-state.XXXXXX")"
          for artifact in dist/python/*.whl dist/python/*.tar.gz; do
            venv="$RUNNER_TEMP/venv-$(basename "$artifact" | tr -c 'A-Za-z0-9' '-')"
            python -m venv "$venv"
            "$venv/bin/pip" install --quiet --disable-pip-version-check "$artifact"
            installed="$("$venv/bin/python" -c 'from importlib.metadata import version; print(version("boss-harness"))')"
            test "$installed" = "$SOURCE_VERSION"
            reported="$("$venv/bin/boss-harness" --version)"
            test "$reported" = "boss-harness $SOURCE_VERSION"
            "$venv/bin/boss-harness" --check --provider none --state-dir "$STATE_DIR" > /dev/null
          done
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/python
          if-no-files-found: error

  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify search normalization
        run: python scripts/check_search_unicode.py
      - name: Compile kernel and scripts
        run: python -m compileall -q harness/src scripts
