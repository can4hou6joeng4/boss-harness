name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build ./harness --outdir dist/python
      - name: Generate release asset manifest
        run: |
          VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('harness/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          python scripts/release_assets.py \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --out-dir dist/python \
            dist/python/*.whl dist/python/*.tar.gz
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/python
          if-no-files-found: error
