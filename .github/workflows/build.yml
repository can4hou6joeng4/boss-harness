name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # 生产产物不打包开发依赖；生产树按 moderate 阻断，开发树仍按 critical 阻断，
      # 避免上游尚无修复版的高危构建工具公告长期冻结所有源码 PR。
      - run: npm audit --audit-level=moderate --omit=dev
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build ./harness --outdir dist/python
      - name: Generate release asset manifest
        run: |
          VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('harness/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          python scripts/release_assets.py \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --out-dir dist/python \
            dist/python/*.whl dist/python/*.tar.gz
      - name: Verify distributions install and start
        shell: bash
        run: |
          VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('harness/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          STATE_DIR="$(mktemp -d "$RUNNER_TEMP/boss-harness-state.XXXXXX")"
          for artifact in dist/python/*.whl dist/python/*.tar.gz; do
            venv="$RUNNER_TEMP/venv-$(basename "$artifact" | tr -c 'A-Za-z0-9' '-')"
            python -m venv "$venv"
            "$venv/bin/pip" install --quiet --disable-pip-version-check "$artifact"
            installed="$("$venv/bin/python" -c 'import boss_harness; print(boss_harness.__version__)')"
            test "$installed" = "$VERSION"
            "$venv/bin/boss-harness" --check --provider none --state-dir "$STATE_DIR" > /dev/null
          done
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/python
          if-no-files-found: error
